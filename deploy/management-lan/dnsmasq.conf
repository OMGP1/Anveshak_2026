# Authoritative-only resolver/DHCP for the isolated VLAN 40. No upstream forwarding.
interface=lan40
bind-interfaces
no-resolv
domain-needed
bogus-priv
local=/soc.internal/
domain=soc.internal
address=/anveshak.soc.internal/10.10.40.10
dhcp-authoritative
dhcp-range=10.10.40.101,10.10.40.110,255.255.255.0,12h
# Intentionally omit DHCP option 3 (default router).
dhcp-option=option:dns-server,10.10.40.53
dhcp-option=option:ntp-server,10.10.40.53
log-dhcp
